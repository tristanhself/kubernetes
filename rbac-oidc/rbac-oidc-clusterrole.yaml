apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-okta-admins
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-okta-admins-cbr
roleRef:
  kind: ClusterRole
  name: k8s-okta-admins
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: Group
    name: k8s-okta-admins # Matches the group specified by OIDC in the AuthN response from OKTA.
    apiGroup: rbac.authorization.k8s.io